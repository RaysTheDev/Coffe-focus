<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café Focus</title>
<style>
:root{--bg:#f5f3ee;--bg2:#e9e4da;--card:#f1ede5;--item:#ece8dd;--ink:#3a2a20;--mute:#8a7566;--acc:#7a5233;--line:#d9cfc2;--cup:#e9e1d4;--danger:#b8403a;--dangerbg:#f0dcd7;--ov:rgba(40,36,32,.72);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
[data-theme=dark]{--bg:#2b2a28;--bg2:#222120;--card:#35332f;--item:#3e3b36;--ink:#efe8de;--mute:#a69a8c;--acc:#b3825a;--line:#55504a;--cup:#47433d;--danger:#e07a72;--dangerbg:#4a312e;--ov:rgba(0,0,0,.6)}
html{background:var(--bg)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{zoom:.9;min-height:calc(100vh/.9);background:var(--bg);color:var(--ink);font-family:var(--sans);padding:0 16px 120px;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;justify-content:center;align-items:center;padding:22px 0;position:relative;max-width:900px;margin:auto;min-height:92px}
nav{display:flex;gap:4px;padding:5px;border-radius:40px;background:var(--item);border:1px solid var(--line)}
nav button{display:flex;gap:8px;align-items:center;padding:10px 18px;border-radius:30px;color:var(--mute);font-size:15px}
nav button.on{background:var(--acc);color:#fff}
.me{position:absolute;right:0;display:flex;gap:8px}
.me button{padding:9px 14px;border-radius:14px;background:var(--item);border:1px solid var(--line);font-size:14px}
.me .th{width:40px;padding:9px 0;border-radius:50%;color:var(--acc)}
[data-v=slip] nav,[data-v=done] nav{visibility:hidden}
[data-v=focus] header{display:none}
main{max-width:560px;margin:0 auto}
.mono{font-family:var(--mono)}
.card{background:var(--card);border-radius:20px;padding:34px 30px;box-shadow:0 8px 30px rgba(90,60,30,.08);margin-top:40px}
.card h2{font:400 26px var(--mono);text-align:center;letter-spacing:1px}
.sub{font:15px var(--mono);color:var(--mute);text-align:center;margin-top:8px}
.dash{border:0;border-top:1.5px dashed var(--line);margin:22px 0}
.dots{text-align:center;color:var(--acc);letter-spacing:12px;font-size:12px;margin-top:6px}
.drink{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:22px;border-radius:14px;background:var(--item);margin-bottom:14px;transition:transform .15s}
.drink:hover{transform:translateY(-2px)}
.drink b{display:block;font:500 19px var(--mono)}
.drink small{color:var(--mute);font:15px var(--mono)}
.drink .e{font-size:34px}
.foot{text-align:center;font:13px var(--mono);color:var(--mute);letter-spacing:3px;margin-top:40px;opacity:.7}
/* slip */
.slip{background:var(--card);border-radius:18px;padding:28px 30px;box-shadow:0 8px 30px rgba(90,60,30,.08)}
.slip h2{font:400 26px var(--mono);text-align:center}
.row{display:flex;justify-content:space-between;font:18px var(--mono);margin:16px 0}
.row span:first-child{color:var(--mute)}
.tear{position:relative;border-top:6px dotted var(--line);margin:10px 0;text-align:center}
.tear span{position:relative;top:-11px;background:var(--bg);padding:2px 12px;font:12px var(--mono);color:var(--mute);border-radius:4px}
.pull{touch-action:none;cursor:grab;text-align:center;user-select:none;-webkit-user-select:none}
.pull .bar{width:50px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 4px;box-shadow:8px 9px 0 -1px var(--line)}
.pull p{font:16px var(--mono);color:var(--mute);margin:14px 0}
.pull .nm{font:500 19px var(--mono)}
.cancel{display:block;margin:26px auto 0;font:14px var(--mono);color:var(--mute);text-decoration:underline}
/* focus */
.focus{text-align:center;padding-top:40px}
.cupw{position:relative;width:260px;height:180px;margin:0 auto}
.cup{position:absolute;left:50px;top:30px;width:150px;height:112px;background:var(--cup);border-radius:14px 14px 42px 42px;padding:9px;z-index:2}
.cup:after{content:"";position:absolute;right:-22px;top:36px;width:34px;height:40px;border-radius:0 24px 24px 0;background:var(--cup);z-index:-1}
.in{position:relative;height:100%;border-radius:6px 6px 32px 32px;overflow:hidden;background:rgba(0,0,0,.05)}
.liq{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--liq);transition:height .4s linear}
.sauc{position:absolute;left:25px;top:132px;width:210px;height:26px;background:var(--cup);border-radius:14px;box-shadow:0 12px 24px rgba(60,40,20,.2)}
.shelf{position:absolute;left:0;top:152px;width:260px;height:14px;border-radius:8px;background:#64492f;z-index:3}
.tm{font:400 62px var(--mono);margin-top:44px;color:var(--ink)}
.lab{font-size:19px;color:var(--mute);margin-top:6px}
.pgw{width:350px;max-width:80vw;height:6px;border-radius:6px;background:var(--line);margin:28px auto;overflow:hidden}
.pgw div{height:100%;width:0;background:var(--acc);transition:width .4s linear}
.pill{display:inline-flex;gap:10px;align-items:center;padding:20px 36px;border-radius:40px;background:var(--item);color:var(--mute);font-size:19px}
.quiet{display:block;margin:34px auto 0;font:18px var(--mono);color:var(--mute);opacity:.8}
.big{font-size:84px;margin:10px 0}
/* todo */
.wk{display:flex;justify-content:space-between;align-items:center;margin:36px 0 22px;font-size:20px}
.arr{font-size:30px;padding:0 14px;color:var(--acc)}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.chip{padding:12px 0;border-radius:14px;background:var(--item);font-size:13px;color:var(--mute);position:relative}
.chip b{display:block;font-size:20px;color:var(--ink);margin-top:3px}
.chip.on{background:var(--acc);color:#fff}.chip.on b{color:#fff}
.chip i{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chip.on i{background:#fff}
.day{margin-top:44px;scroll-margin-top:20px}
.day h3{font:400 19px var(--mono);color:var(--mute);display:flex;gap:12px;align-items:center}
.day h3.t{color:var(--acc);font-weight:700}
.badge{font:13px var(--sans);background:var(--item);padding:5px 12px;border-radius:14px;color:var(--mute);font-weight:400}
.none{text-align:center;color:var(--mute);opacity:.6;padding:30px 0}
.task{display:flex;gap:14px;align-items:flex-start;background:var(--card);padding:14px 16px;border-radius:14px;margin-top:12px}
.ck{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--acc);color:#fff;font-size:14px;line-height:20px}
.task.done .ck{background:var(--acc)}
.task.done .tx{text-decoration:line-through;opacity:.5}
.tx{flex:1;line-height:1.45;overflow-wrap:anywhere;padding-top:1px}
.x{color:var(--mute);font-size:20px;line-height:1;padding:2px 6px}
.fab{position:fixed;right:30px;bottom:30px;width:68px;height:68px;border-radius:50%;background:var(--acc);color:#fff;font-size:38px;box-shadow:0 8px 24px rgba(90,60,30,.3)}
/* profile */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
.stat{background:var(--card);border-radius:18px;padding:26px 20px;text-align:center}
.stat b{display:block;font:400 38px var(--mono);color:var(--acc)}
.stat span{color:var(--mute);font-size:14px}
.sec{font:400 19px var(--mono);margin:40px 0 16px;color:var(--mute)}
.grid{display:flex;flex-wrap:wrap;gap:12px}
.em{width:58px;height:58px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-size:28px;background:var(--card)}
.empty{color:var(--mute);line-height:1.5}
.bk{display:flex;gap:10px;margin-top:10px}
.btn{padding:13px 20px;border-radius:14px;background:var(--item);border:1px solid var(--line);font-size:15px}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;padding:17px;font-size:18px}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.5}
/* modal */
.ov{position:fixed;inset:0;background:var(--ov);display:grid;place-items:center;padding:16px;z-index:9}
.md{background:var(--card);border-radius:20px;padding:30px;width:min(520px,100%);position:relative}
.md h3{font:700 20px var(--mono);letter-spacing:1px;margin-bottom:22px}
.md .close{position:absolute;right:22px;top:20px;font-size:26px;color:var(--mute)}
.md input[type=text]{width:100%;padding:18px;border-radius:14px;border:2px solid var(--line);background:var(--item);color:var(--ink);font:18px var(--sans)}
.cnt{text-align:right;font-size:14px;color:var(--mute);margin:8px 0 18px}
.lbl{color:var(--mute);margin-bottom:10px}
.md .chips{margin-bottom:22px}
.acts{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.acts button{font:17px var(--mono);padding:16px 24px;border-radius:12px;background:var(--item);border:1px solid var(--line)}
.acts .stop{background:var(--dangerbg);color:var(--danger);border-color:var(--dangerbg)}
@media(max-width:600px){.me .nm{display:none}.card{padding:26px 18px}nav button{padding:9px 12px;font-size:14px}}
/* compact */
main{max-width:500px}
header{min-height:64px;padding:14px 0}
nav button{padding:7px 14px;font-size:14px}
.me button{padding:7px 12px;font-size:13px}.me .th{width:34px;padding:7px 0}
.card{padding:24px 22px;margin-top:28px}.card h2{font-size:21px}
.drink{padding:15px 18px;margin-bottom:10px}.drink b{font-size:17px}.drink small{font-size:13px}.drink .e{font-size:28px;position:relative}
.stat b{font-size:30px}.fab{width:56px;height:56px;font-size:32px;right:24px;bottom:24px}
.tm{font-size:52px;margin-top:34px}.pill{padding:14px 28px;font-size:16px}
/* boutons animés */
button{transition:transform .18s cubic-bezier(.3,1.4,.5,1),background-color .2s,box-shadow .2s,opacity .2s}
button:not(:disabled):hover{transform:translateY(-2px)}
button:not(:disabled):active{transform:scale(.95)}
.btn:hover,.me button:hover,.pill:hover,.acts button:hover,.drink:hover{box-shadow:0 6px 16px rgba(90,60,30,.15)}
nav button:hover:not(.on){background:rgba(122,82,51,.12)}
.fab:hover{transform:rotate(90deg) scale(1.06)!important}.fab:active{transform:rotate(90deg) scale(.92)!important}
.me .th:hover{transform:rotate(25deg)!important}
.ck:hover{transform:scale(1.15)!important}
.task.done .ck{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.35)}}
/* glissement entre écrans */
main.ent{animation:sin .45s cubic-bezier(.2,.8,.2,1) backwards}
main.out{animation:sout .24s ease-in forwards}
@keyframes sin{from{opacity:0;transform:translateX(60px)}}
@keyframes sout{to{opacity:0;transform:translateX(-60px)}}
/* ticket déchiré */
.paper{background:var(--card);border-radius:16px;padding:22px 24px;box-shadow:0 8px 30px rgba(90,60,30,.08)}
.paper h2{font:400 21px var(--mono);text-align:center}
.paper .row{font-size:15px;margin:12px 0}
.tear{margin:12px 0;transition:opacity .2s}
.jolt{animation:jolt .35s}
@keyframes jolt{20%{transform:translateY(-3px) rotate(-.6deg)}50%{transform:translateY(2px) rotate(.4deg)}}
.away{animation:away .8s cubic-bezier(.5,0,.9,.6) forwards;transform-origin:20% 0}
@keyframes away{from{transform:translateY(var(--dy,0px))}25%{transform:translateY(calc(var(--dy,0px) + 8px)) rotate(-2deg)}to{transform:translateY(calc(var(--dy,0px) + 340px)) translateX(70px) rotate(14deg);opacity:0}}
/* fumée */
:root{--steam:rgba(120,90,60,.35)}[data-theme=dark]{--steam:rgba(255,255,255,.28)}
.steams{position:absolute;left:0;right:0;top:-26px;height:52px;pointer-events:none;transition:opacity .6s}
.steams i{position:absolute;bottom:0;width:9px;height:34px;border-radius:50%;background:var(--steam);filter:blur(4px);opacity:0;animation:rise 3.2s ease-in infinite}
.steams i:nth-child(1){left:92px}.steams i:nth-child(2){left:125px;height:40px;animation-delay:1.1s}.steams i:nth-child(3){left:158px;animation-delay:2.1s}
.cool .steams{opacity:0}
@keyframes rise{0%{transform:translate(0,22px) scaleX(.7);opacity:0}25%{opacity:.8}60%{transform:translate(-5px,-6px) scaleX(1.2);opacity:.5}100%{transform:translate(6px,-30px) scaleX(1.8);opacity:0}}
.mini{position:absolute;left:0;right:0;top:-10px;height:16px;pointer-events:none;text-decoration:none}
.mini i{position:absolute;bottom:0;width:4px;height:12px;border-radius:50%;background:var(--steam);filter:blur(2px);opacity:0;animation:rise2 2.6s ease-in infinite}
.mini i:nth-child(1){left:10px}.mini i:nth-child(2){left:20px;animation-delay:1.2s}
@keyframes rise2{0%{transform:translateY(6px);opacity:0}30%{opacity:.8}100%{transform:translateY(-10px);opacity:0}}
/* polices réduites */
.stats{gap:10px;margin-top:28px}.stat{padding:16px 12px;border-radius:14px}.stat b{font-size:20px}.stat span{font-size:11.5px}
.wk{font-size:15px;margin:28px 0 16px}.arr{font-size:22px}
.chip{padding:9px 0;font-size:11.5px;border-radius:12px}.chip b{font-size:15px;margin-top:2px}
.day{margin-top:34px}.day h3{font-size:14px}.badge{font-size:11.5px;padding:3px 10px}
.none{font-size:13px;padding:22px 0}.task{font-size:14px}.sec{font-size:15px}
/* tasses du focus */
.focus{padding-top:64px}
.cup{background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(0,0,0,.07)),var(--cup);box-shadow:0 10px 18px rgba(60,40,20,.18)}
.cup:before{content:"";position:absolute;left:13px;top:12px;width:7px;height:55%;border-radius:8px;background:rgba(255,255,255,.4);z-index:3}
.in{box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.liq:before{content:"";position:absolute;left:-2px;right:-2px;top:-6px;height:14px;border-radius:50%;background:var(--surf,#9a6a40);box-shadow:inset 0 -3px 5px rgba(0,0,0,.2)}
[data-d=espresso]{--surf:#a0703f}[data-d=latte]{--surf:#f3e5cf}[data-d=matcha]{--surf:#b9d28a}
[data-d=espresso] .cup{width:124px;left:63px;height:94px;top:48px}
[data-d=espresso] .cup:after{top:26px;width:28px;height:32px}
[data-d=latte] .cup{height:128px;top:14px}
[data-d=latte] .liq:after{content:"♥";position:absolute;left:50%;top:-6px;transform:translateX(-50%) scaleY(.45);font-size:16px;color:#b78a5e}
[data-d=matcha] .cup{left:36px;width:178px;height:100px;top:42px;border-radius:12px 12px 74px 74px}
[data-d=matcha] .cup:after{display:none}
[data-d=matcha] .in{border-radius:4px 4px 64px 64px}
[data-d=matcha] .liq:after{content:"";position:absolute;left:14%;right:14%;top:-3px;height:8px;background:radial-gradient(circle,#e3f0c6 1.6px,transparent 2.2px) 0 0/10px 8px;opacity:.75}
.steams{opacity:var(--heat,1)}
.cool .steams{opacity:0}
.steams i{width:6px;height:46px;background:linear-gradient(transparent,var(--steam),transparent);filter:blur(3px);animation:wisp 3.8s ease-in-out infinite}
.steams i:nth-child(1){left:84px}.steams i:nth-child(2){left:110px;animation-delay:.9s;animation-duration:4.2s}.steams i:nth-child(3){left:138px;animation-delay:1.9s;animation-duration:3.6s}.steams i:nth-child(4){left:164px;animation-delay:2.7s;animation-duration:4.4s}
@keyframes wisp{0%{transform:translate(0,26px) scale(.6,.7);opacity:0}20%{opacity:.9}50%{transform:translate(-7px,-4px) rotate(-6deg)}75%{transform:translate(6px,-20px) scale(1.4,1.1) rotate(5deg);opacity:.5}100%{transform:translate(-3px,-42px) scale(1.9,1.2);opacity:0}}
.md input[type=password]{width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--item);color:var(--ink);font:18px var(--sans);margin-bottom:10px}
/* écran de connexion */
[data-v=auth] nav{visibility:hidden}[data-v=auth] #nm{display:none}
.auth{max-width:400px;margin:0 auto}.au{margin-top:10px}.ic{text-align:center;font-size:34px}
.sub2{text-align:center;color:var(--mute);margin:6px 0 20px}
.seg{display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--item);margin-bottom:6px}
.seg button{flex:1;padding:12px;border-radius:10px;font:14px var(--mono);letter-spacing:1.5px;color:var(--mute)}
.seg .on{background:var(--acc);color:#fff}
.fl{display:block;font:13px var(--mono);letter-spacing:1px;color:var(--mute);margin:16px 0 8px}
.auth input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--item);color:var(--ink);font:16px var(--sans)}
.lnk{display:block;margin:12px 0 0 auto;font-size:13px;color:var(--mute)}
.er{min-height:20px;margin:10px 0;font-size:13px;color:var(--danger)}
.auth .btn.p{font:15px var(--mono);letter-spacing:1.5px}
.alt{display:flex;justify-content:center;gap:18px;margin-top:14px}.alt button{font-size:12px;color:var(--mute);text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body data-v="cafe">
<header>
  <nav id="nav"></nav>
  <div class="me"><button class="nm" data-a="acct" id="nm"></button><button class="th" data-a="theme" id="th" aria-label="Changer de thème"></button></div>
</header>
<main id="v"></main>
<input type="file" id="file" accept="application/json" hidden>
<script>
const K='cafe-focus-v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const D=[{id:'espresso',n:'Espresso',m:10,e:'☕',c:'#3d2a1e'},{id:'latte',n:'Latte',m:25,e:'🥛',c:'#c9a37a'},{id:'matcha',n:'Matcha',m:40,e:'🍵',c:'#7f9a52'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def=()=>({name:'Ray <3',theme:'light',tasks:{},sessions:[]});
let user='';try{user=localStorage.getItem(K+'-user')||''}catch(e){}
const sk=()=>user?K+':'+user:K;
function read(k){for(const x of [k,k+':bak']){try{const o=JSON.parse(localStorage.getItem(x));if(o&&typeof o==='object')return {...def(),...o}}catch(e){}}return null}
function load(){return read(sk())||def()}
function save(){try{const k=sk(),old=localStorage.getItem(k);if(old)localStorage.setItem(k+':bak',old);localStorage.setItem(k,JSON.stringify(S))}catch(e){}}
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const sunday=d=>{const x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x};
const wd=d=>cap(d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.',''));
let S=load(),view='cafe',sel=key(new Date()),wk=sunday(new Date()),cur=null,F=null;

let busy=0,tearing=0;
function go(v){view=v;render();const m=$('#v');m.classList.remove('out','ent');void m.offsetWidth;m.classList.add('ent')}
function render(){
  document.documentElement.dataset.theme=S.theme;
  document.body.dataset.v=view;
  $('#nm').innerHTML='👤 '+esc(S.name)+(user?' ✓':'');
  $('#th').textContent=S.theme==='dark'?'☾':'☀';
  const tabs=[['cafe','☕','Café'],['todo','☑','To-Do'],['profil','👤','Profil']];
  $('#nav').innerHTML=tabs.map(t=>`<button data-a="tab" data-x="${t[0]}" class="${view===t[0]?'on':''}">${t[1]} ${t[2]}</button>`).join('');
  $('#v').innerHTML=({cafe:cafeV,todo:todoV,profil:profilV,slip:slipV,focus:focusV,done:doneV,auth:authV})[view]();
  if(view==='slip')bindSlip();
  if(view==='focus')upd();
  if(view==='auth')bindAuth();
}
function cafeV(){return `<div class="card"><h2>✦ COMMANDE CAFÉ ✦</h2><p class="sub">choisis ta boisson</p><hr class="dash">

  else if(a==='forgot')forgot();
  else if(a==='resend')resend();
  else if(a==='aback'){am='login';render()}
  else if(a==='guest'){try{sessionStorage.setItem('cf-guest','1')}catch(e){}go('cafe')}
  else if(a==='cfg')mailModal();
  else if(a==='wk'){wk.setDate(wk.getDate()+7*x);const d=parse(sel);d.setDate(d.getDate()+7*x);sel=key(d);render()}
  else if(a==='day'){sel=x;render();document.getElementById('d-'+x).scrollIntoView({behavior:'smooth'})}
  else if(a==='add')addModal();
  else if(a==='tog'){const t=S.tasks[b.dataset.k].find(t=>t.id===b.dataset.i);t.done=!t.done;save();const y=scrollY;render();scrollTo(0,y)}
  else if(a==='del'){S.tasks[b.dataset.k]=S.tasks[b.dataset.k].filter(t=>t.id!==b.dataset.i);if(!S.tasks[b.dataset.k].length)delete S.tasks[b.dataset.k];save();const y=scrollY;render();scrollTo(0,y)}
  else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));l.download='cafe-focus-sauvegarde.json';l.click();URL.revokeObjectURL(l.href)}
  else if(a==='imp')$('#file').click();
});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.tasks!=='object'||!Array.isArray(o.sessions))throw 0;S={...def(),...o};save();render()}catch(_){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f);e.target.value=''};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)blip(b.matches('[data-a=stop],[data-a=quit],[data-a=aback],.close,.cancel[data-a=tab]'))},true);
window.addEventListener('pagehide',save);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let gst=false;try{gst=!!sessionStorage.getItem('cf-guest')}catch(e){}
if(!user&&!gst)view='auth';
if(S.run){const r=S.run,d=D.find(x=>x.id===r.id);
 if(d&&r.paused&&r.rem>0){F={d,total:d.m*60000,rem:r.rem,paused:true,end:0};F.t=setInterval(tick,250);view='focus'}
 else if(d&&r.end>Date.now()){F={d,total:d.m*60000,rem:r.end-Date.now(),paused:false,end:r.end};F.t=setInterval(tick,250);view='focus'}
 else{delete S.run;save()}}
render();
if(F&&F.paused){$('#brk').textContent='▶ Reprendre';$('.focus').classList.add('cool')}
</script>
</body>
